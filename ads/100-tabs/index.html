    <style>

      .abs { position: absolute; }
      .u { font-family: "Unbounded", sans-serif; }

      .ch { display: inline-block; will-change: transform; }
      .sp { display: inline-block; width: 0.32em; }
      .split { perspective: 900px; }
      .line > .split { display: inline-block; }
      #orbit-3d, #s2-ui-3d, #s3-txt, #s4-3d, #s5 { visibility: hidden; }

      /* ---------------- background ---------------- */

      }
      #rays {
        position: absolute; left: -460px; top: -540px; width: 2000px; height: 2000px; border-radius: 50%; opacity: 0;

      #h1 { position: absolute; left: 0; right: 0; top: 262px; text-align: center; }

      #swarm { position: absolute; inset: 0; transform-style: preserve-3d; }
      #s2-ui-3d { perspective: 1400px; perspective-origin: 540px 900px; }
      #s2-ui { position: absolute; inset: 0; transform-style: preserve-3d; }
      .ltab {

      #n-app { position: absolute; left: 150px; top: 44px; font: 700 34px/1.1 "Poppins", sans-serif; color: rgba(16, 40, 73, 0.75); letter-spacing: 1px; }
      #n-time { position: absolute; left: 150px; top: 86px; font: 600 28px/1.1 "Poppins", sans-serif; color: rgba(16, 40, 73, 0.5); }

      #s4 { position: absolute; inset: 0; transform-style: preserve-3d; }

      #card1 { top: 430px; }

      #card2 .c-b { color: var(--yellow); }

      #emb-shine { position: absolute; inset: 0; overflow: hidden;

      #svc { position: absolute; left: 0; right: 0; top: 760px; text-align: center; font: 800 48px/1.25 "Poppins", sans-serif; }

        box-shadow: 0 18px 0 #b89c00, 0 40px 90px rgba(0, 0, 0, 0.55), 0 0 90px rgba(255, 225, 0, 0.35);
        color: var(--navy);

      .spark { position: absolute; left: 0; top: 0; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; opacity: 0; }

    </style>

  <body>
    <div id="root" data-composition-id="root" data-width="1080" data-height="1920" data-start="0" data-duration="15">
      <!-- ============ BACKGROUND ============ -->
      <div id="bg" class="clip layer" data-start="0" data-duration="15" data-track-index="0">
        <div id="bg-base" class="layer"></div>
        <div id="glow-c" class="glow"></div>
        <div id="glow-v" class="glow"></div>
        <div id="glow-y" class="glow"></div>
        <div id="rays"></div>
        <div id="ceiling-wrap"><div id="ceiling"></div></div>
        <div id="floor-wrap"><div id="floor"></div></div>
        <div id="dust" class="layer"></div>
      </div>

      <!-- ============ WORLD (camera rig) ============ -->
      <div id="cam" class="clip layer" data-start="0" data-duration="15" data-track-index="1">
        <!-- Scene 1: browser overload -->
        <div id="s1" class="layer">
          <div id="s1-3d" class="layer">
            <div id="s1-stage">
              <div id="win">
                <div id="win-bar">
                  <i class="dot" style="left: 26px; background: var(--coral)"></i>
                  <i class="dot" style="left: 60px; background: var(--yellow)"></i>
                  <i class="dot" style="left: 94px; background: var(--cyan)"></i>
                  <div id="strip"></div>
                </div>
                <div id="addr">otak.saya/<b>semua-serentak</b></div>
                <i class="skel" style="top: 210px; width: 620px"></i>
                <i class="skel" style="top: 260px; width: 760px"></i>
                <i class="skel" style="top: 310px; width: 520px"></i>
                <i class="skel" style="top: 860px; width: 700px"></i>
                <i class="skel" style="top: 910px; width: 460px"></i>
              </div>
              <div id="flyers"></div>
            </div>
          </div>
          <div id="s1-txt" class="layer">
            <div id="halo1"></div>
            <div id="h1">
              <span id="h1a" class="line split">KEPALA</span>
              <span id="h1b" class="line split">MACAM ADA</span>
            </div>
            <div id="n100-3d">
              <div id="n100"></div>
            </div>
            <div id="tabsw" class="line"><span class="split">TABS</span><span id="qx" class="q split">?!</span></div>
          </div>
        </div>

        <!-- Scenes 2 + 3: tab swarm that collapses into the brain (same 3D space, so one orbit moves both) -->
        <div id="orbit-3d" class="layer">
          <div id="orbit">
            <div id="swarm"></div>
            <div id="brainwrap" class="layer" style="transform-style: preserve-3d">
              <svg id="brain-svg" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
                <defs>
                  <linearGradient id="bgrad" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0" stop-color="#9ffcf9" />
                    <stop offset="0.5" stop-color="#26d6d2" />
                    <stop offset="1" stop-color="#ffe100" />
                  </linearGradient>

      <!-- Original synthesised soundtrack + SFX (tools/make_audio.py) -->
      <audio id="soundtrack" src="audio/soundtrack.wav" data-start="0" data-duration="15" data-track-index="3" data-volume="1"></audio>

      <script>
        gsap.registerPlugin(MorphSVGPlugin, DrawSVGPlugin);

        // ---------- deterministic helpers ----------
        let seed = 20261025;
        const rnd = () => {
          // mulberry32: same sequence on every load, so every render is identical
          seed |= 0; seed = (seed + 0x6d2b79f5) | 0;
          let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
        const R = (a, b) => a + (b - a) * rnd();
        const pick = (arr) => arr[Math.floor(rnd() * arr.length)];
        const el = (tag, cls, parent, style = "") => {
          const e = document.createElement(tag);
          if (cls) e.className = cls;
          if (style) e.setAttribute("style", style);
          parent.appendChild(e);
          return e;
        };
        const svgEl = (tag, attrs, parent) => {
          const e = document.createElementNS("http://www.w3.org/2000/svg", tag);
          for (const k in attrs) e.setAttribute(k, attrs[k]);
          parent.appendChild(e);
          return e;
        };

        // Split ".split" text into per-character spans for kinetic typography.
        document.querySelectorAll(".split").forEach((node) => {
          const text = node.textContent;
          node.textContent = "";
          for (const c of text) {
            const s = document.createElement("span");
            s.className = c === " " ? "sp" : "ch";
            if (c !== " ") s.textContent = c;
            node.appendChild(s);
          }
        });

        const CH = ["#26d6d2", "#ffe100", "#ffffff", "#ff6b8b", "#9b8cff", "#4da3ff"];
        const makeTab = (parent, w, color, dark) => {
          const t = el("div", "tab" + (dark ? " dark" : ""), parent, `width:${w}px;height:${Math.round(w * 0.68)}px;--c:${color}`);
          el("i", "tt", t);
          el("i", "tb", t);
          el("i", "tb tb2", t);
          return t;
        };

        // ---------- brain geometry (designed on a 600x520 grid, mapped into frame px) ----------
        const BX = 540, BY = 700, BS = 1.1;
        const mapPath = (d, mirror = false, cx = BX, cy = BY, s = BS) =>
          d.replace(/(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)/g, (_, x, y) => {
            let px = +x;
            if (mirror) px = 600 - px;
            return `${(cx + (px - 300) * s).toFixed(1)},${(cy + (+y - 260) * s).toFixed(1)}`;
          });
        const BRAIN_OUT =
          "M296,52 C262,26 214,22 176,38 C140,30 98,52 86,92 C52,108 36,150 46,190 C24,222 24,272 48,302 C36,342 52,388 88,408 C96,446 134,474 176,470 C206,496 256,496 292,470 " +
          "L308,470 C344,496 394,496 424,470 C466,474 504,446 512,408 C548,388 564,342 552,302 C576,272 576,222 554,190 C564,150 548,108 514,92 C502,52 460,30 424,38 C386,22 338,26 304,52 Z";
        const FISSURE = "M300,62 C294,140 306,220 298,300 C292,370 304,420 300,462";
        const GYRI = [
          "M118,98 C150,78 182,108 214,86 C236,72 258,86 270,74",
          "M70,170 C104,150 128,190 166,166 C196,148 214,182 248,160 C262,152 274,160 284,150",
          "M56,250 C92,226 120,268 158,244 C186,226 212,262 244,240 C262,228 276,240 286,232",
          "M70,330 C106,310 128,350 168,326 C196,310 220,344 252,322 C266,314 278,320 288,312",
          "M110,410 C140,392 168,424 204,404 C230,390 252,416 280,398",
        ];
        const NODES_L = [[150, 130], [232, 132], [108, 214], [200, 206], [258, 270], [128, 296], [212, 340], [150, 392], [238, 420], [84, 262]];
        const EDGES_L = [[0, 1], [0, 2], [1, 3], [2, 3], [3, 4], [2, 9], [9, 5], [5, 3], [5, 6], [4, 6], [6, 7], [7, 8], [6, 8]];
        const P = ([x, y], m) => [BX + ((m ? 600 - x : x) - 300) * BS, BY + (y - 260) * BS];
        // window rectangle the brain outline morphs out of, and the two card rectangles it morphs into
        const rr = (x, y, w, h, r) => {
          const k = r * 0.5523;
          return `M${x + r},${y} L${x + w - r},${y} C${x + w - r + k},${y} ${x + w},${y + r - k} ${x + w},${y + r} L${x + w},${y + h - r} C${x + w},${y + h - r + k} ${x + w - r + k},${y + h} ${x + w - r},${y + h} L${x + r},${y + h} C${x + r - k},${y + h} ${x},${y + h - r + k} ${x},${y + h - r} L${x},${y + r} C${x},${y + r - k} ${x + r - k},${y} ${x + r},${y} Z`;
        };
        const WIN_RECT = rr(110, 560, 860, 960, 40);
        const CARD1 = rr(72, 432, 936, 416, 42);
        const CARD2 = rr(72, 952, 936, 416, 42);

        const bOut = document.getElementById("bOut");
        const bOut2 = document.getElementById("bOut2");
        const BRAIN_D = mapPath(BRAIN_OUT);
        bOut.setAttribute("d", WIN_RECT);
        bOut2.setAttribute("d", BRAIN_D);
        const gyriG = document.getElementById("gyri");
        svgEl("path", { d: mapPath(FISSURE), class: "gy" }, gyriG);
        GYRI.forEach((g) => {
          svgEl("path", { d: mapPath(g), class: "gy" }, gyriG);
          svgEl("path", { d: mapPath(g, true), class: "gy" }, gyriG);
        });
        const netG = document.getElementById("net");
        const flowG = document.getElementById("flow");
        const nodesG = document.getElementById("nodes");
        const edges = [];
        [false, true].forEach((m) => EDGES_L.forEach(([a, b]) => edges.push([P(NODES_L[a], m), P(NODES_L[b], m)])));
        [[4, 4], [1, 1], [6, 6]].forEach(([a, b]) => edges.push([P(NODES_L[a], false), P(NODES_L[b], true)]));
        edges.forEach(([a, b], i) => {
          const d = `M${a[0].toFixed(1)},${a[1].toFixed(1)} L${b[0].toFixed(1)},${b[1].toFixed(1)}`;
          svgEl("path", { d, class: "nl" }, netG);
          if (i % 2 === 0) svgEl("path", { d, class: "fl" }, flowG);
        });
        [false, true].forEach((m) =>
          NODES_L.forEach((n) => {
            const [x, y] = P(n, m);
            svgEl("circle", { cx: x.toFixed(1), cy: y.toFixed(1), r: 10, fill: "#ffffff", class: "nd" }, nodesG);
          })
        );
        // small brain glyphs for the notification icon and the consultation bubble
        document.getElementById("n-brain").setAttribute("d", mapPath(BRAIN_OUT, false, 42, 44, 0.115) + " " + mapPath(FISSURE, false, 42, 44, 0.115));
        document.getElementById("bub-brain").setAttribute(
          "d",
          [BRAIN_OUT, FISSURE, GYRI[1], GYRI[3]].map((d) => mapPath(d, false, 145, 132, 0.27)).join(" ") + " " + [GYRI[1], GYRI[3]].map((d) => mapPath(d, true, 145, 132, 0.27)).join(" ")
        );

        // brain target points for the swarm (sampled along the outline and gyri)
        const helpers = document.getElementById("helpers");
        const hOut = svgEl("path", { d: BRAIN_D }, helpers);
        const targets = [];
        const L0 = hOut.getTotalLength();
        for (let i = 0; i < 64; i++) {
          const p = hOut.getPointAtLength((L0 * i) / 64);
          targets.push([p.x, p.y]);
        }
        gyriG.querySelectorAll("path").forEach((g) => {
          const L = g.getTotalLength();
          for (let i = 0; i < 5; i++) {
            const p = g.getPointAtLength((L * (i + 0.5)) / 5);
            targets.push([p.x, p.y]);
          }
        });

        // ---------- build procedural elements ----------
        // window tab strip
        const strip = document.getElementById("strip");
        const MINI = 26;
        for (let i = 0; i < MINI; i++) {
          el("i", "mini", strip, `left:${(i * 794) / MINI}px;width:${794 / MINI + 6}px;--c:${CH[i % CH.length]};z-index:${MINI - i}`);
        }
        // flying tabs (scene 1)
        const flyers = [];
        const flyWrap = document.getElementById("flyers");
        for (let i = 0; i < 60; i++) {
          const w = R(140, 260);
          const t = makeTab(flyWrap, w, pick(CH), rnd() < 0.3);
          const ang = R(0, Math.PI * 2);
          flyers.push({ t, w, sx: 540 + R(-200, 200), sy: 1000 + R(-240, 240), ex: 540 + Math.cos(ang) * R(700, 1200), ey: 1000 + Math.sin(ang) * R(900, 1400), ez: R(260, 470), rz: R(-90, 90), ry: R(-60, 60), d: R(0.75, 1.15) });
        }
        // swarm (scenes 2-3)
        const swarm = [];
        const swWrap = document.getElementById("swarm");
        for (let i = 0; i < targets.length; i++) {
          const w = R(130, 230);
          const t = makeTab(swWrap, w, pick(CH), rnd() < 0.35);
          const ang = R(0, Math.PI * 2);
          const rad = R(520, 1900);
          const z0 = R(-3600, -1500);
          swarm.push({ t, w, x: 540 + Math.cos(ang) * rad, y: 760 + Math.sin(ang) * rad * 1.5, z0, travel: R(1900, 2400), rz: R(-40, 40), rx: R(-30, 30), spin: R(-120, 120), tg: targets[i] });
        }
        // labeled foreground tabs (scene 2)
        const LT = [
          { t: "KERJA", x: 70, y: 300, w: 430, r: -6, c: "#26d6d2" },
          { t: "DUIT", x: 570, y: 420, w: 400, r: 5, c: "#ffe100" },
          { t: "TIDUR", x: 120, y: 640, w: 430, r: 4, c: "#9b8cff" },
          { t: "OVERTHINKING", x: 170, y: 860, w: 780, r: -3, c: "#ff6b8b" },
          { t: "MASA DEPAN", x: 60, y: 1090, w: 650, r: -5, c: "#4da3ff" },
          { t: "EMOSI", x: 600, y: 1270, w: 410, r: 6, c: "#26d6d2" },
        ];
        const ui = document.getElementById("s2-ui");
        const ltabs = LT.map((d, i) => {
          const t = el("div", "ltab", ui, `left:${d.x}px;top:${d.y}px;width:${d.w}px;--c:${d.c}`);
          ui.insertBefore(t, document.getElementById("notif"));
          el("i", "lh", t);
          el("i", "lfav", t);
          el("i", "lbar", t);
          el("b", "lx", t).textContent = "×";
          el("i", "lprog", t);
          el("div", "lt", t).textContent = d.t;
          return t;
        });
        // orbiting particles around the brain (3D parallax during the orbit)
        const orbps = document.getElementById("orbps");
        const orbP = [];
        for (let i = 0; i < 26; i++) {
          const a = (i / 26) * Math.PI * 2;
          const p = el("i", "orbp", orbps);
          orbP.push({ p, a, r: R(330, 470), z: R(-320, 320), s: R(0.5, 1.3) });
        }
        // background dust
        const dust = document.getElementById("dust");
        const dusts = [];
        for (let i = 0; i < 34; i++) {
          const d = el("i", "dust", dust, `left:${R(20, 1060).toFixed(0)}px;top:${R(100, 1900).toFixed(0)}px;opacity:${R(0.2, 0.6).toFixed(2)};transform:scale(${R(0.5, 1.6).toFixed(2)})`);
          dusts.push(d);
        }
        // sparks
        const sparksWrap = document.getElementById("sparks");
        const sparks = [];
        for (let i = 0; i < 28; i++) sparks.push(el("i", "spark", sparksWrap, `background:${i % 3 === 0 ? "#ffe100" : i % 3 === 1 ? "#26d6d2" : "#ffffff"}`));
        const streakWrap = document.getElementById("streaks");
        const streaks = [];
        for (let i = 0; i < 16; i++) streaks.push(el("i", "streak", streakWrap));
        // extruded "100": back layers give real depth inside a preserve-3d stack
        const n100 = document.getElementById("n100");
        const DEPTH = 14;
        for (let i = DEPTH; i >= 1; i--) {
          const l = el("div", "nl nx", n100, `transform:translateZ(${-i * 6}px);color:${i > 9 ? "#06343c" : i > 4 ? "#0a5f63" : "#0f9c9a"}`);
          l.textContent = "100";
        }
        const nf = el("div", "nl", n100);
        nf.id = "n100f";
        nf.textContent = "100";
        const g1 = el("div", "nl ng", n100);
        g1.id = "ng1";
        g1.textContent = "100";
        const g2 = el("div", "nl ng", n100);
        g2.id = "ng2";
        g2.textContent = "100";

        // =========================================================
        // TIMELINE
        // =========================================================
        const tl = gsap.timeline({ paused: true, defaults: { ease: "power3.out" } });
        const D = 15, T1 = 2.0, T2 = 4.5, T3 = 6.5, T4 = 10.5; // scene cuts, on the 120 BPM beat grid

        // deterministic camera shake (hand-written offsets, no randomness)
        const shake = (at, amp = 22, target = "#cam") =>
          tl.to(target, { keyframes: { x: [0, amp, -0.9 * amp, 0.7 * amp, -0.5 * amp, 0.3 * amp, 0], y: [0, -0.7 * amp, 0.8 * amp, -0.9 * amp, 0.5 * amp, -0.3 * amp, 0] }, duration: 0.2, ease: "none" }, at);
        const sweep = (sel, at, d = 0.7) => tl.fromTo(sel, { xPercent: 0 }, { xPercent: 560, duration: d, ease: "power2.inOut" }, at);
        const burst = (at, cx, cy, n = 28, dist = 420) => {
          sparks.slice(0, n).forEach((s, i) => {
            const a = (i / n) * Math.PI * 2 + 0.3;
            const r = dist * (0.6 + 0.4 * ((i * 37) % 10) / 10);
            tl.fromTo(s, { x: cx, y: cy, scale: 1.4, opacity: 1 }, { x: cx + Math.cos(a) * r, y: cy + Math.sin(a) * r, scale: 0.2, opacity: 0, duration: 0.7, ease: "power3.out", immediateRender: false }, at);
          });
        };
        const ring = (sel, at, cx, cy, s0, s1, d = 0.8, o = 1) =>
          tl.fromTo(sel, { x: cx, y: cy, scale: s0, opacity: o }, { scale: s1, opacity: 0, duration: d, ease: "power2.out", immediateRender: false }, at);

        // ---------- BACKGROUND (whole video) ----------
        tl.fromTo("#floor", { backgroundPosition: "0px 0px" }, { backgroundPosition: "0px 1920px", duration: T2, ease: "power1.in" }, 0);
